[project]
name = "ai-bias-test"
version = "0.1.0"
description = "Demographic bias audit for LLMs — Singapore CV counterfactual study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.68.0",
    "anthropic>=0.50.0",
    "google-genai>=1.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
]

[project.scripts]
run-experiment = "run_experiment:main"
generate-viz   = "generate_viz:main"

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bias_framework", "config"]
